[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rubin-cue-stimuli"
version = "0.1.0"
description = "Rubin face-vase cue images and their generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pillow>=11.0",
  "resvg-py>=0.3.3,<0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[project.scripts]
rubin-cues = "rubin_cues.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rubin_cues"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

